<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link rel="icon" href="data:," />
    <title>Tall Tale</title>
    <style>
      #start-page {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: rgba(30, 44, 30, 0.82);
        color: #f6f1e2;
        font-family: system-ui, sans-serif;
        z-index: 10;
        text-align: center;
        padding: 16px;
      }
      #start-page h1 {
        margin: 0;
        font-size: 56px;
        letter-spacing: 1px;
      }
      #start-page p {
        margin: 0;
        max-width: 520px;
        line-height: 1.4;
      }
      #enter-vr {
        font-size: 26px;
        padding: 16px 44px;
        border: none;
        border-radius: 14px;
        background: #f2c14e;
        color: #2b2412;
        font-weight: 700;
        cursor: pointer;
      }
      #enter-vr:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      #mic-status {
        font-size: 15px;
        opacity: 0.85;
      }
      #start-page details {
        font-size: 14px;
        opacity: 0.85;
      }
      #debug-keys {
        text-align: left;
        margin: 8px 0 0;
        padding-left: 18px;
      }
    </style>
  </head>
  <body style="margin: 0">
    <div id="scene-container"></div>
    <div id="start-page">
      <h1>Tall Tale</h1>
      <p>You are a giant in the middle of a tiny castle. Pinch the goblins that climb your wall and eat them, and use your giant tools to help your army.</p>
      <button id="enter-vr" disabled>Loading...</button>
      <p id="mic-status"></p>
      <details>
        <summary>Debug keys</summary>
        <ul id="debug-keys"></ul>
      </details>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
